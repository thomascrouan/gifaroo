<div class="search" role="search">
  <label class="visually-hidden" for="search-input">Rechercher des GIFs</label>
  <svg
    class="search__icon"
    width="24"
    height="24"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2.2"
    stroke-linecap="round"
    aria-hidden="true"
  >
    <circle cx="11" cy="11" r="7" />
    <path d="M20 20l-4.2-4.2" />
  </svg>
  <input
    id="search-input"
    class="search__input"
    type="search"
    placeholder="Search KLIPY"
    autocomplete="off"
    [value]="query()"
    (input)="onInput($event)"
  />
</div>
