<a class="skip-link" href="#main-content" (click)="onSkipToContent($event)">Aller au contenu</a>

<header class="header">
  <div class="header__inner">
    <a class="logo" routerLink="/">Gifaroo</a>

    <nav class="nav" aria-label="Navigation principale">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        ><span>Accueil</span></a
      >
      <a routerLink="/collections" routerLinkActive="active"><span>Collections</span></a>
      <a routerLink="/favorites" routerLinkActive="active">
        <span>Favoris</span>
        @if (favoriteCount() > 0) {
          <span class="badge">{{ favoriteCount() }}</span>
        }
      </a>
    </nav>
  </div>
</header>

<main id="main-content" class="content" tabindex="-1">
  <router-outlet />
</main>
